<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Blue Gradient for the N Body -->
    <linearGradient id="bodyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1" /> <!-- Deep Blue -->
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" /> <!-- Lighter Blue -->
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Dark) -->
  <circle cx="64" cy="64" r="60" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <!-- Cursive N Centered -->
  <text x="50%" y="72%" 
        font-family="'Brush Script MT', 'Lucida Calligraphy', 'Apple Chancery', cursive" 
        font-style="italic"
        font-weight="bold" 
        font-size="90" 
        text-anchor="middle" 
        fill="url(#bodyGrad)"
        stroke="#0d1117"
        stroke-width="1"
        transform="translate(0, 5)">N</text>
</svg>
