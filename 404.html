<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found.">
    <title>404 | Nandan Pandey</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="error-page">
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <p class="error-path" id="missing-path"></p>
        <a href="./" class="btn btn-accent">Back to Portfolio</a>
    </div>

    <script>
        const stored = localStorage.getItem('theme');
        const theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        const el = document.getElementById('missing-path');
        if (el) el.textContent = window.location.pathname;
    </script>
</body>

</html>
