<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Nandan Pandey — Backend engineer building scalable APIs, distributed systems, and resilient data platforms.">
    <meta name="author" content="Nandan Pandey">

    <!-- Open Graph -->
    <meta property="og:title" content="Nandan Pandey | Backend Engineer">
    <meta property="og:description"
        content="Backend engineer building scalable APIs, distributed systems, and resilient data platforms.">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Nandan Pandey | Backend Engineer">
    <meta name="twitter:description"
        content="Backend engineer building scalable APIs, distributed systems, and resilient data platforms.">

    <title>Nandan Pandey | Backend Engineer</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/main.js" defer></script>
    <!-- Prevent FOUC: apply theme before paint -->
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>

<body>
    <a href="#content" class="skip-link">Skip to Content</a>

    <!-- Cursor spotlight (desktop only) -->
    <div class="spotlight" aria-hidden="true"></div>

    <div class="page-wrapper">
        <!-- ── Left Sidebar ────────────────────────────── -->
        <header class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-brand">
                    <h1><a href="./">Nandan Pandey</a></h1>
                    <h2 id="sidebar-title">Backend Engineer</h2>
                    <p id="sidebar-tagline">Building reliable backend systems that survive real traffic.</p>
                </div>

                <nav class="section-nav" aria-label="In-page navigation">
                    <ul>
                        <li><a href="#about" class="active">
                                <span class="nav-indicator"></span>
                                <span>About</span>
                            </a></li>
                        <li><a href="#experience">
                                <span class="nav-indicator"></span>
                                <span>Experience</span>
                            </a></li>
                        <li><a href="#projects">
                                <span class="nav-indicator"></span>
                                <span>Projects</span>
                            </a></li>
                        <li><a href="#writing">
                                <span class="nav-indicator"></span>
                                <span>Blog</span>
                            </a></li>
                        <li><a href="#resume">
                                <span class="nav-indicator"></span>
                                <span>Resume</span>
                            </a></li>
                        <li><a href="#contact">
                                <span class="nav-indicator"></span>
                                <span>Contact</span>
                            </a></li>
                    </ul>
                </nav>
            </div>

            <div class="sidebar-bottom" id="sidebar-socials">
                <!-- Social links rendered by JS from profile.json -->
            </div>
        </header>

        <!-- ── Right Content ───────────────────────────── -->
        <main class="main-content" id="content">

            <!-- About -->
            <section class="section" id="about" aria-label="About me">
                <div class="section-label">About</div>
                <div id="about-content">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Experience -->
            <section class="section" id="experience" aria-label="Work experience">
                <div class="section-label">Experience</div>
                <div id="experience-content" class="interactive-list">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Projects -->
            <section class="section" id="projects" aria-label="Selected projects">
                <div class="section-label">Projects</div>
                <div id="projects-content" class="interactive-list">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Writing / Blogs -->
            <section class="section" id="writing" aria-label="Blog posts and writing">
                <div class="section-label">Writing</div>
                <div id="blogs-search-container">
                    <!-- Search bar rendered by JS -->
                </div>
                <div id="blogs-content" class="interactive-list">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Resume -->
            <section class="section" id="resume" aria-label="Resume">
                <div class="section-label">Resume</div>
                <div id="resume-content">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Contact -->
            <section class="section" id="contact" aria-label="Contact information">
                <div class="section-label">Contact</div>
                <div id="contact-content">
                    <!-- Rendered by JS -->
                </div>
            </section>

            <!-- Footer -->
            <footer class="footer" id="footer-content">
                <!-- Rendered by JS -->
            </footer>
        </main>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
        <a href="#about">About</a>
        <a href="#experience">Exp</a>
        <a href="#projects">Projects</a>
        <a href="#writing">Blog</a>
        <a href="#resume">Resume</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Scroll to top (mobile only) -->
    <button class="scroll-to-top" id="scroll-to-top" aria-label="Scroll to top" type="button">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M14.77 12.79a.75.75 0 01-1.06-.02L10 8.832 6.29 12.77a.75.75 0 11-1.08-1.04l4.25-4.5a.75.75 0 011.08 0l4.25 4.5a.75.75 0 01-.02 1.06z" clip-rule="evenodd"/></svg>
    </button>
</body>

</html>
