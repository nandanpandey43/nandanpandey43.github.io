<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Technical article by Nandan Pandey.">
    <title>Blog Post | Nandan Pandey</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="./js/blogPage.js" defer></script>
</head>

<body>
    <div class="blog-page">
        <a href="./" class="blog-back" id="blog-back">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
            Nandan Pandey
        </a>

        <header class="blog-detail-header">
            <h1 id="blog-title">Loading article…</h1>
            <div class="blog-detail-meta">
                <span id="blog-date"></span>
                <span id="blog-reading-time"></span>
            </div>
        </header>

        <article id="blog-content" class="markdown-body">
            <!-- Markdown rendered here -->
        </article>
    </div>

    <script>
        /* Theme persistence for blog page */
        const stored = localStorage.getItem('theme');
        const theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>

</html>
