<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | Backend Developer</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Lightweight Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/js/main.js" defer></script>
    <style>
        /* Typography overrides for markdown content */
        .markdown-body h2 {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .markdown-body h3 {
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .markdown-body p {
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .markdown-body pre {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .markdown-body code {
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        .markdown-body ul {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body id="page-blog-detail">
    <div id="navbar-root"></div>

    <main class="container fade-in" style="max-width: 800px;">
        <header style="margin-bottom: 3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem;">
            <a href="/blogs.html" class="text-secondary text-mono" style="font-size: 0.9rem;">← Back to Blogs</a>
            <h1 id="blog-title" style="margin-top: 1rem; font-size: 2.5rem; line-height: 1.2;">Loading...</h1>
            <p id="blog-date" class="text-mono text-secondary mt-md"></p>
        </header>

        <article id="blog-content" class="markdown-body" style="min-height: 300px;">
            <!-- Markdown content injected here -->
        </article>
    </main>

    <div id="footer-root"></div>
</body>

</html>
